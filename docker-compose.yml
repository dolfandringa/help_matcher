services:
  api:
    build:
      context: .
      target: combined
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-help_matcher}
      SERVER_PORT: ${SERVER_PORT:-8000}
      BOT_NAME: ${BOT_NAME:-Help Matcher Bot}
      BOT_CLIENT_ID: ${BOT_CLIENT_ID:-}
      BOT_CLIENT_SECRET: ${BOT_CLIENT_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v20.0}
      META_API_BASE_URL: ${META_API_BASE_URL:-http://localhost:8000/local/whatsapp/graph}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-at-least-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-help-matcher/0.1}
      GEOAPIFY_BASE_URL: ${GEOAPIFY_BASE_URL:-https://api.geoapify.com}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOAPIFY_BATCH_POLL_SECONDS: ${GEOAPIFY_BATCH_POLL_SECONDS:-1}
      GEOAPIFY_BATCH_TIMEOUT_SECONDS: ${GEOAPIFY_BATCH_TIMEOUT_SECONDS:-90}
      GEOCODING_LOCATION_SUFFIXES: ${GEOCODING_LOCATION_SUFFIXES:-Valle del Cauca, Colombia;Quindio, Colombia;Risaralda, Colombia;Caldas, Colombia}
      SERVER_HOST: 0.0.0.0
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
    command: ["serve", "--reload"]

  postgres:
    image: postgis/postgis:16-3.4-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-help_matcher}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
